[project]
name = "compliance-api"
version = "0.1.0"
description = "Compliance API service"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "python-dotenv",
    "reportlab",
    "python-multipart",
    "pdfplumber",
    "pdf2image",
    "openai",
    "passlib[bcrypt]",
    "bcrypt>=4.0.1,<4.1",
    "python-jose[cryptography]",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
seed-example = "scripts.seed_example:main"
seed-regulations = "scripts.seed_regulations:main"
audit-rules = "scripts.audit_rules:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]
